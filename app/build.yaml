targets:
  $default:
    builders:
      drift_dev:
        options:
          # Zeitstempel als ISO-Text statt Unix-Sekunden: lesbar beim Debuggen
          # und beim Abgleich mit dem Server ohne Umrechnung verwendbar.
          store_date_time_values_as_text: true
          named_parameters: true
          sql:
            dialect: sqlite
            options:
              modules:
                - json1

      json_serializable:
        options:
          explicit_to_json: true
          field_rename: snake
          include_if_null: false
          create_to_json: true
