targets:
  $default:
    builders:
      drift_dev:analyzer:
        options: &drift_options
          # Modern Drift defaults: typed booleans/date-times stored as text and
          # the null-aware type system. Set once here so every table agrees.
          store_date_time_values_as_text: true
          named_parameters: true
          sql:
            dialect: sqlite
            options:
              modules:
                - json
      drift_dev:modular:
        options: *drift_options

      json_serializable:
        options:
          explicit_to_json: true
          field_rename: snake
          include_if_null: false
          create_to_json: true
